[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "publish-to-all"
version = "0.1.0"
description = "Local story preparation for publishing destinations"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5", "PyYAML>=6,<7", "Pillow>=11,<13", "playwright>=1.51,<2"]

[project.scripts]
publish-to-all = "publish_to_all.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
